<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Harold's Bristol Birthday</title>
  <meta name="description" content="Itinerary and map for Harry's birthday weekend in Bristol.">
  <meta name="theme-color" content="#0f1115">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="intro" id="intro"></p>
      <p class="countdown" id="countdown"></p>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Days"></nav>

  <main class="layout">
    <section class="list" id="list" aria-live="polite"></section>
    <section class="map-wrap">
      <div id="map" role="region" aria-label="Map of places"></div>
    </section>
  </main>

  <footer class="foot">Happy birthday Harold 👑 Looking forward to seeing you all 💋</footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
